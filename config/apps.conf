# Tracked BIDS apps for the daily Apptainer auto-build.
#
# Pipe-delimited, one app per line. Blank lines and lines starting with '#'
# are ignored. Fields:
#
#   name         short id, used only in logs
#   docker_repo  Docker Hub "org/repo" to poll for tags
#   tag_regex    extended regex (grep -E); only tags fully matching this are
#                considered "full releases" (excludes latest/unstable/rc/
#                experimental/etc. automatically, since they won't match)
#   output_dir   where the built .sif (and its .log) should land
#
# name       | docker_repo           | tag_regex                        | output_dir
fmriprep     | nipreps/fmriprep      | ^[0-9]+\.[0-9]+\.[0-9]+$         | /data/local/container/fmriprep
qsiprep      | pennlinc/qsiprep      | ^[0-9]+\.[0-9]+\.[0-9]+$         | /data/local/container/qsiprep
qsirecon     | pennlinc/qsirecon     | ^[0-9]+\.[0-9]+\.[0-9]+$         | /data/local/container/qsirecon
mriqc        | nipreps/mriqc         | ^[0-9]+\.[0-9]+\.[0-9]+$         | /data/local/container/mriqc
freesurfer   | freesurfer/freesurfer | ^[0-9]+\.[0-9]+\.[0-9]+$         | /data/local/container/freesurfer
fastsurfer   | deepmi/fastsurfer     | ^cuda-v[0-9]+\.[0-9]+\.[0-9]+$   | /data/local/container/fastsurfer
bidsvalidator | bids/validator       | ^[0-9]+\.[0-9]+\.[0-9]+$         | /data/local/container/bidsvalidator
mrtrix3_connectome | bids/mrtrix3_connectome | ^[0-9]+\.[0-9]+\.[0-9]+$   | /data/local/container/mrtrix3_connectome
giga_connectome | bids/giga_connectome | ^[0-9]+\.[0-9]+\.[0-9]+$        | /data/local/container/giga_connectome
rshrf        | bids/rshrf            | ^v?[0-9]+\.[0-9]+\.[0-9]+$       | /data/local/container/rshrf
hipsta       | deepmi/hipsta         | ^[0-9]+\.[0-9]+\.[0-9]+$         | /data/local/container/hipsta
